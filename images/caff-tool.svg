<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>

    <!-- Window Gradient -->
    <linearGradient id="windowBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c2128" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>

    <!-- Primary Accent Gradient (Cyan / Teal) -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ec9b0" />
      <stop offset="100%" stop-color="#79c0ff" />
    </linearGradient>

    <!-- Glow Effect Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Background Canvas -->
  <rect width="100%" height="100%" fill="url(#bgGradient)" rx="16" />

  <!-- Terminal Window Container -->
  <g transform="translate(60, 40)">
    <!-- Window Border & Shadow Frame -->
    <rect width="680" height="420" rx="12" fill="none" stroke="#30363d" stroke-width="1.5" />
    <rect width="680" height="420" rx="12" fill="url(#windowBg)" />

    <!-- Titlebar Header -->
    <path d="M 0,12 Q 0,0 12,0 L 668,0 Q 680,0 680,12 L 680,42 L 0,42 Z" fill="#21262d" />
    <line x1="0" y1="42" x2="680" y2="42" stroke="#0d1117" stroke-width="1.5" />

    <!-- Terminal Window Controls (macOS style) -->
    <g transform="translate(18, 21)">
      <circle cx="0" cy="0" r="6" fill="#ff5f56" />
      <circle cx="20" cy="0" r="6" fill="#ffbd2e" />
      <circle cx="40" cy="0" r="6" fill="#27c93f" />
    </g>

    <!-- Window Title -->
    <text x="295" y="24" fill="#8b949e" font-family="'Fira Code', 'Cascadia Code', 'Consolas', monospace" font-size="12" font-weight="500">
      caff_tool.py
    </text>

    <!-- Background code aesthetics (real commands from the tool) -->
    <g fill="#30363d" font-family="'Fira Code', 'Cascadia Code', monospace" font-size="11" opacity="0.55">
      <text x="28" y="72">[OK] ThroneRoom: 75 entries (in-place)</text>
      <text x="28" y="90">[OK] TrainingCave: 5 entries (in-place)</text>
      <text x="28" y="108">[OK] TrainingLevel: 31 entries (in-place)</text>
      <text x="28" y="126">[OK] UBend: 8 entries (in-place)</text>
      <text x="28" y="144">[OK] UIFrontend: 58 entries (in-place)</text>
      <text x="28" y="162">[OK] UIPause: 25 entries (in-place)</text>
      <text x="28" y="180">[OK] VolcanoInside: 2 entries (in-place)</text>
      <text x="28" y="198">[OK] VolcanoRace: 11 entries (in-place)</text>
      <text x="28" y="216">[OK] WarBoss: 34 entries (in-place)</text>
      <text x="28" y="234">[OK] Windmill: 61 entries (in-place)</text>
      <text x="28" y="252">[OK] WindmillExploded: 14 entries (in-place)</text>
      <text x="28" y="270">[OK] basic_characters: 1 entries (in-place)</text>
      <text x="28" y="288">[OK] chapters_text: 77 entries (in-place)</text>
      <text x="28" y="306">[OK] extra_speech: 12 entries (in-place)</text>
      <text x="28" y="324">[OK] mpClasses: 204 entries (in-place)</text>
      <text x="28" y="342">[OK] tips: 28 entries (in-place)</text>
      <text x="28" y="360">[SUCCESS] 69 banks written to 'text'</text>
    </g>

    <!-- CENTRAL LOGO ICON: Hexagon + &gt;_ -->
    <g transform="translate(340, 195)">
      <!-- Outer dashed hexagon -->
      <polygon points="0,-78 66,-39 66,39 0,78 -66,39 -66,-39"
               fill="none" stroke="url(#accentGradient)" stroke-width="3.5"
               stroke-dasharray="10 5" opacity="0.55" />

      <!-- Inner solid hexagon -->
      <polygon points="0,-66 56,-33 56,33 0,66 -56,33 -56,-33"
               fill="#0d1117" stroke="#30363d" stroke-width="1.5" />

      <!-- The '&gt;' symbol -->
      <path d="M -26,-28 L 10,0 L -26,28"
            fill="none" stroke="url(#accentGradient)" stroke-width="8.5"
            stroke-linecap="round" stroke-linejoin="round" filter="url(#subtleGlow)" />

      <!-- Underscore cursor -->
      <rect x="4" y="20" width="24" height="7" rx="1.5" fill="#4ec9b0" filter="url(#neonGlow)" />
    </g>

    <!-- LOGO TYPOGRAPHY -->
    <g transform="translate(340, 310)">
      <text x="0" y="0" text-anchor="middle"
            font-family="'Segoe UI', system-ui, -apple-system, sans-serif"
            font-weight="800" font-size="40" letter-spacing="5">
        <tspan fill="#e6edf3">CAFF </tspan>
        <tspan fill="url(#accentGradient)">TOOL</tspan>
      </text>

      <text x="0" y="26" text-anchor="middle"
            font-family="'Fira Code', 'Cascadia Code', monospace"
            font-weight="500" font-size="12" fill="#8b949e" letter-spacing="2.5">
        CAFF TEXT BANK EDITOR
      </text>
    </g>

    <!-- Bottom prompt with blinking cursor -->
    <g transform="translate(28, 380)">
      <text x="0" y="0" fill="#4ec9b0" font-family="'Fira Code', monospace" font-weight="600" font-size="15">&gt;</text>
      <rect x="16" y="-12" width="9" height="15" fill="#4ec9b0" opacity="0.85">
        <animate attributeName="opacity" values="1;0;1" dur="1.05s" repeatCount="indefinite" />
      </rect>
    </g>
  </g>
</svg>
